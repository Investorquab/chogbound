name: ChogBound CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install workspace dependencies
        run: npm install
      - name: Typecheck simulation engine
        run: npm run typecheck --workspace=chogbound-sim
      - name: Run simulation engine tests
        run: npm run test:engine
      - name: Check trait mapping covers every Chog
        run: npm run coverage --workspace=chogbound-sim
      - name: Run web unit tests
        run: npm run test:unit --workspace=chogbound-web
      - name: Build web app
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright quality gates
        run: npm run test:e2e
